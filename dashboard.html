<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ssurd — 분석 히스토리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--off:#f8f8fa;--ink:#0a0a0f;--g1:#f0f0f5;--g2:#e0e0eb;--g3:#8888aa;--g4:#555570;--blue:#2563eb;--blue2:#3b82f6;--purple:#7c3aed;--teal:#0891b2;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--off);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
.hidden{display:none!important;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--g2);}
.nav-logo{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--ink);text-decoration:none;}
.nav-logo .dot{color:var(--blue);}
.nav-mid{display:flex;gap:32px;}
.nav-lnk{font-size:14px;color:var(--g4);text-decoration:none;transition:color .2s;}
.nav-lnk:hover{color:var(--ink);}
.nav-r{display:flex;align-items:center;gap:12px;}
.nav-uname{font-size:13px;color:var(--g3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-ghost{font-size:13px;font-weight:500;padding:8px 18px;border-radius:100px;background:transparent;color:var(--g4);border:1px solid var(--g2);cursor:pointer;transition:all .2s;}
.btn-ghost:hover{border-color:var(--g3);color:var(--ink);}
.btn-solid{font-size:13px;font-weight:700;padding:8px 20px;border-radius:100px;background:var(--ink);color:white;border:none;cursor:pointer;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;}
.btn-solid:hover{background:var(--blue);}

/* 메인 레이아웃 */
main{padding:80px 48px 80px;max-width:1080px;margin:0 auto;}

/* 페이지 헤더 */
.page-header{margin-bottom:40px;}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.page-h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.025em;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--g3);}

/* 로그인 유도 */
.login-prompt{background:white;border-radius:24px;border:1px solid var(--g2);padding:64px;text-align:center;}
.login-prompt .prism-sm{width:80px;height:80px;perspective:300px;margin:0 auto 24px;}
.lp-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:cubeS 8s linear infinite;}
@keyframes cubeS{from{transform:rotateY(0deg) rotateX(20deg)}to{transform:rotateY(360deg) rotateX(20deg)}}
.lpf{position:absolute;width:60px;height:60px;top:10px;left:10px;border-radius:14px;border:1px solid rgba(255,255,255,.5);}
.lpf1{background:linear-gradient(135deg,#dbeafe,#bfdbfe);transform:translateZ(30px);}
.lpf2{background:linear-gradient(135deg,#ede9fe,#ddd6fe);transform:translateZ(-30px) rotateY(180deg);}
.lpf3{background:linear-gradient(135deg,#fce7f3,#fbcfe8);transform:rotateY(90deg) translateZ(30px);}
.lpf4{background:linear-gradient(135deg,#ecfdf5,#a7f3d0);transform:rotateY(-90deg) translateZ(30px);}
.lpf5{background:linear-gradient(135deg,#fef9c3,#fde68a);transform:rotateX(90deg) translateZ(30px);}
.lpf6{background:linear-gradient(135deg,#fee2e2,#fecaca);transform:rotateX(-90deg) translateZ(30px);}
.login-prompt h2{font-size:22px;font-weight:700;margin-bottom:8px;}
.login-prompt p{font-size:14px;color:var(--g3);margin-bottom:28px;}

/* 통계 카드 그리드 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.stat-card{background:white;border-radius:18px;border:1px solid var(--g2);padding:24px;}
.stat-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--g3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.stat-num{font-size:36px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1;}
.stat-sub{font-size:12px;color:var(--g3);margin-top:4px;}
.stat-card.blue .stat-num{color:var(--blue);}
.stat-card.green .stat-num{color:#059669;}
.stat-card.purple .stat-num{color:var(--purple);}

/* 사용량 카드 */
.usage-card{background:var(--ink);border-radius:18px;padding:24px;color:white;margin-bottom:32px;}
.usage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.usage-plan{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.1em;text-transform:uppercase;}
.usage-remaining{font-size:32px;font-weight:700;letter-spacing:-.02em;}
.usage-remaining span{font-size:14px;color:rgba(255,255,255,.4);font-weight:400;margin-left:4px;}
.usage-bar-track{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
.usage-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--purple));border-radius:2px;transition:width .8s var(--ease);}
.usage-meta{display:flex;justify-content:space-between;margin-top:8px;}
.usage-meta-txt{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.4);}

/* 차트 섹션 */
.chart-card{background:white;border-radius:18px;border:1px solid var(--g2);padding:28px;margin-bottom:32px;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.chart-title{font-size:15px;font-weight:700;}
.growth-badge{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;padding:4px 12px;border-radius:100px;background:#f0fdf4;color:#059669;border:1px solid #bbf7d0;}
.chart-wrap{overflow-x:auto;}
.chart-svg-wrap{min-width:400px;}
.chart-labels{display:flex;justify-content:space-between;margin-top:8px;padding:0 10px;}
.chart-labels span{font-family:'DM Mono',monospace;font-size:11px;color:var(--g3);}

/* 히스토리 리스트 */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.list-title{font-size:15px;font-weight:700;}
.history-item{background:white;border-radius:16px;border:1px solid var(--g2);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px;cursor:pointer;transition:all .2s var(--ease);}
.history-item:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,.1);}
.hist-left{flex:1;min-width:0;}
.hist-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--g3);letter-spacing:.04em;margin-bottom:4px;}
.hist-job{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-summary{font-size:13px;color:var(--g3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-right{display:flex;align-items:center;gap:24px;flex-shrink:0;}
.hist-stat{text-align:center;}
.hist-stat-num{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1;}
.hist-stat-num.score{color:#059669;}
.hist-stat-num.grade{color:var(--blue);}
.hist-stat-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--g3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
.hist-arrow{width:36px;height:36px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--g4);transition:all .2s;}
.history-item:hover .hist-arrow{background:var(--blue);color:white;}

/* 빈 상태 */
.empty-state{background:white;border-radius:18px;border:1px solid var(--g2);padding:64px;text-align:center;}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.empty-state p{font-size:14px;color:var(--g3);margin-bottom:28px;}

/* 로딩 */
.loading-state{text-align:center;padding:60px;}
.loading-spin{width:32px;height:32px;border:2px solid var(--g2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;color:var(--g3);}

@media(max-width:860px){
  nav{padding:0 20px;} .nav-mid{display:none;}
  main{padding:76px 20px 60px;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .hist-right{gap:16px;}
  .hist-summary{display:none;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Ss<span class="dot">.</span>urd</a>
  <div class="nav-mid">
    <a href="index.html" class="nav-lnk">홈</a>
    <a href="dashboard.html" class="nav-lnk" style="color:var(--ink);font-weight:600">히스토리</a>
  </div>
  <div class="nav-r">
    <div id="navUser" class="hidden" style="display:flex;align-items:center;gap:10px">
      <span id="navUserName" class="nav-uname"></span>
      <button class="btn-ghost" onclick="handleLogout()">로그아웃</button>
    </div>
    <a href="write.html" class="btn-solid" id="newAnalysisBtn">+ 새 분석</a>
    <button id="navLoginBtn" class="btn-solid" onclick="location.href='index.html'">로그인</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <div class="page-eyebrow">MY DASHBOARD</div>
    <h1 class="page-h1">분석 히스토리</h1>
    <p class="page-sub">과거 분석 결과를 확인하고 자소서 성장을 추적하세요.</p>
  </div>

  <!-- 비로그인 -->
  <div id="loginPrompt" class="login-prompt hidden">
    <div class="prism-sm">
      <div class="lp-cube">
        <div class="lpf lpf1"></div><div class="lpf lpf2"></div><div class="lpf lpf3"></div>
        <div class="lpf lpf4"></div><div class="lpf lpf5"></div><div class="lpf lpf6"></div>
      </div>
    </div>
    <h2>로그인이 필요해요</h2>
    <p>히스토리를 보려면 먼저 로그인해 주세요.</p>
    <a href="index.html" class="btn-solid" style="display:inline-flex;padding:14px 32px;font-size:15px">로그인하러 가기 →</a>
  </div>

  <!-- 로딩 -->
  <div id="loadingState" class="loading-state hidden">
    <div class="loading-spin"></div>
    <div class="loading-txt">히스토리를 불러오고 있어요</div>
  </div>

  <!-- 메인 콘텐츠 -->
  <div id="mainContent" class="hidden">
    <!-- 사용량 -->
    <div class="usage-card">
      <div class="usage-top">
        <div>
          <div class="usage-plan" id="planLabel">무료 플랜</div>
          <div class="usage-remaining"><span id="remainingCount">-</span> <span>회 남음</span></div>
        </div>
        <a href="write.html" class="btn-solid" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)">+ 새 분석</a>
      </div>
      <div class="usage-bar-track"><div class="usage-bar-fill" id="usageBarFill" style="width:0%"></div></div>
      <div class="usage-meta">
        <span class="usage-meta-txt" id="usageLabel">- 회 사용</span>
        <span class="usage-meta-txt">이번 달</span>
      </div>
    </div>

    <!-- 통계 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">총 분석</div>
        <div class="stat-num" id="statTotal">-</div>
        <div class="stat-sub">회 분석 완료</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-label">평균 점수</div>
        <div class="stat-num" id="statAvg">-</div>
        <div class="stat-sub">/ 100점</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">최고 점수</div>
        <div class="stat-num" id="statBest">-</div>
        <div class="stat-sub">/ 100점</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-label">최고 등급</div>
        <div class="stat-num" id="statBestGrade">-</div>
        <div class="stat-sub">Grade</div>
      </div>
    </div>

    <!-- 점수 추이 차트 -->
    <div class="chart-card" id="chartCard" style="display:none">
      <div class="chart-header">
        <div class="chart-title">점수 추이</div>
        <div class="growth-badge hidden" id="growthBadge"><span id="growthValue"></span></div>
      </div>
      <div class="chart-wrap">
        <div class="chart-svg-wrap">
          <svg id="trendChart" width="100%" height="150" viewBox="0 0 800 150" preserveAspectRatio="none"></svg>
          <div class="chart-labels" id="chartLabels"></div>
        </div>
      </div>
    </div>

    <!-- 히스토리 리스트 -->
    <div class="list-header">
      <div class="list-title">최근 분석 내역</div>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- 빈 상태 -->
  <div id="emptyState" class="empty-state hidden">
    <div style="font-size:40px;margin-bottom:16px">✦</div>
    <h3>아직 분석 기록이 없어요</h3>
    <p>첫 번째 자소서를 분석해보세요!</p>
    <a href="write.html" class="btn-solid" style="display:inline-flex;padding:14px 32px;font-size:15px">지금 분석 시작하기 →</a>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, getDocs, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCeqiOD3PDMD3xL0IAM52xGMBHJdMOfsDY",
  authDomain:"ssurd-6400c.firebaseapp.com",
  projectId:"ssurd-6400c",
  storageBucket:"ssurd-6400c.firebasestorage.app",
  messagingSenderId:"574073259312",
  appId:"1:574073259312:web:5148cc8a6a9897b93474f5"
});
const auth=getAuth(app), db=getFirestore(app);

const show=id=>{const el=document.getElementById(id);el.classList.remove('hidden');};
const hide=id=>document.getElementById(id).classList.add('hidden');

onAuthStateChanged(auth, async user => {
  hide('loadingState');
  if(!user){
    show('loginPrompt');
    hide('navLoginBtn');
    return;
  }

  hide('navLoginBtn');
  const nu=document.getElementById('navUser');
  nu.classList.remove('hidden'); nu.style.display='flex';
  document.getElementById('navUserName').textContent=user.displayName||user.email;

  show('loadingState');

  // 구독 정보
  const userSnap=await getDoc(doc(db,'users',user.uid));
  const ud=userSnap.exists()?userSnap.data():{};
  const plan=ud.plan||'free';
  const limit=plan==='starter'?10:3;
  const used=ud.monthlyUsage||0;
  const remaining=Math.max(0,limit-used);

  document.getElementById('planLabel').textContent=plan==='starter'?'스타터 플랜':'무료 플랜';
  document.getElementById('remainingCount').textContent=remaining;
  document.getElementById('usageLabel').textContent=`${limit}회 중 ${used}회 사용`;
  document.getElementById('usageBarFill').style.width=`${Math.min(100,(used/limit)*100)}%`;

  // 히스토리
  const q=query(collection(db,'analyses'),where('uid','==',user.uid),orderBy('createdAt','desc'));
  const snap=await getDocs(q);
  const docs=snap.docs.map(d=>({id:d.id,...d.data()}));

  hide('loadingState');

  if(docs.length===0){show('emptyState');return;}

  show('mainContent');
  document.getElementById('mainContent').style.display='block';

  // 통계
  const scores=docs.map(d=>d.report?.score||0);
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const best=Math.max(...scores);
  const bestDoc=docs.find(d=>d.report?.score===best);
  document.getElementById('statTotal').textContent=docs.length;
  document.getElementById('statAvg').textContent=avg;
  document.getElementById('statBest').textContent=best;
  document.getElementById('statBestGrade').textContent=bestDoc?.report?.grade||'-';

  // 차트
  if(docs.length>=2){
    const chartCard=document.getElementById('chartCard');
    chartCard.style.display='block';
    const trendDocs=[...docs].reverse().slice(-8);
    renderChart(trendDocs);
    const latest=docs[0].report?.score||0;
    const oldest=docs[docs.length-1].report?.score||0;
    const diff=latest-oldest;
    const gb=document.getElementById('growthBadge');
    gb.classList.remove('hidden');
    document.getElementById('growthValue').textContent=(diff>=0?'+':'')+diff+'점';
    gb.style.background=diff>=0?'#f0fdf4':'#fff1f2';
    gb.style.color=diff>=0?'#059669':'#e11d48';
    gb.style.borderColor=diff>=0?'#bbf7d0':'#fecdd3';
  }

  renderHistory(docs);
});

function renderChart(docs){
  const W=800,H=150,PAD=14;
  const scores=docs.map(d=>d.report?.score||0);
  const minS=Math.max(0,Math.min(...scores)-15);
  const maxS=Math.min(100,Math.max(...scores)+15);
  const xStep=(W-PAD*2)/(docs.length-1);
  const yScale=(H-PAD*2)/(maxS-minS);
  const pts=scores.map((s,i)=>({x:PAD+i*xStep,y:H-PAD-(s-minS)*yScale}));
  const pathD=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD=pathD+` L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
  document.getElementById('trendChart').innerHTML=`
    <defs>
      <linearGradient id="cg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${areaD}" fill="url(#cg)"/>
    ${pts.map((p,i)=>`
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#2563eb"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-10).toFixed(1)}" text-anchor="middle" font-size="11" font-family="DM Mono" fill="#555570" font-weight="500">${scores[i]}</text>
    `).join('')}`;
  document.getElementById('chartLabels').innerHTML=docs.map(d=>{
    const date=d.createdAt?.toDate?d.createdAt.toDate():new Date();
    return `<span>${date.getMonth()+1}/${date.getDate()}</span>`;
  }).join('');
}

function renderHistory(docs){
  const el=document.getElementById('historyList');
  el.innerHTML=docs.map(d=>{
    const date=d.createdAt?.toDate?d.createdAt.toDate():new Date();
    const dateStr=`${date.getFullYear()}. ${date.getMonth()+1}. ${date.getDate()}`;
    const score=d.report?.score||'-';
    const grade=d.report?.grade||'-';
    const summary=d.report?.summary||'';
    const scoreColor=typeof score==='number'?(score>=80?'#059669':score>=60?'#2563eb':score>=40?'#d97706':'#e11d48'):'var(--ink)';
    return `<div class="history-item" onclick="location.href='report.html?id=${d.id}'">
      <div class="hist-left">
        <div class="hist-date">${dateStr}</div>
        <div class="hist-job">${d.jobTitle||'—'}</div>
        <div class="hist-summary">${summary}</div>
      </div>
      <div class="hist-right">
        <div class="hist-stat">
          <div class="hist-stat-num" style="color:${scoreColor}">${score}</div>
          <div class="hist-stat-lbl">점수</div>
        </div>
        <div class="hist-stat">
          <div class="hist-stat-num grade">${grade}</div>
          <div class="hist-stat-lbl">등급</div>
        </div>
        <div class="hist-arrow">→</div>
      </div>
    </div>`;
  }).join('');
}

window.handleLogout=async()=>{await signOut(auth);location.href='index.html';};
</script>
</body>
</html>
